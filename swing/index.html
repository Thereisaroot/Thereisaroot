<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="meta.title">Boing! Boing!</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- Preload local font to avoid first-launch miss in WebView -->
    <!-- <link rel="preload" href="./assets/fonts/dalmoori.woff2" as="font" type="font/woff2" crossorigin> -->
    <!-- <link rel="preload" href="./assets/fonts/PressStart2P-Regular.ttf" as="font" type="font/ttf" crossorigin> -->
    <!-- Use local @font-face instead of remote Google Fonts -->
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="debug-panel" hidden>
      <div class="row">
        <strong data-i18n="debug.title">Debug</strong>
        <span class="hint" data-i18n="debug.hint">(Press V to toggle)</span>
      </div>
      <div class="grid">
        <label><span data-i18n="debug.jumpSpeed">Jump Speed</span> <input type="range" id="dbg-jumpSpeed" min="50" max="150" step="1"></label>
        <label><span data-i18n="debug.jumpImpulse">Jump Impulse</span> <input type="range" id="dbg-jumpImpulse" min="300" max="1000" step="1"></label>
        <label><span data-i18n="debug.catchRadius">Catch Radius</span> <input type="range" id="dbg-catchR" min="8" max="80" step="1"></label>
        <label><span data-i18n="debug.budSwayMin">Buds Sway Min%</span> <input type="range" id="dbg-budSwayMin" min="0" max="60" step="1"></label>
        <label><span data-i18n="debug.budSwayMax">Buds Sway Max%</span> <input type="range" id="dbg-budSwayMax" min="0" max="80" step="1"></label>
        <label><span data-i18n="debug.lengthMin">Rope Length Min</span> <input type="range" id="dbg-Lmin" min="40" max="300" step="1"></label>
        <label><span data-i18n="debug.lengthMax">Rope Length Max</span> <input type="range" id="dbg-Lmax" min="100" max="520" step="1"></label>
        <label><span data-i18n="debug.lengthJitter">Length Jitter %</span> <input type="range" id="dbg-Ljit" min="0" max="60" step="1"></label>
        <label><span data-i18n="debug.spacingMin">Spacing Min</span> <input type="range" id="dbg-Dmin" min="60" max="300" step="1"></label>
        <label><span data-i18n="debug.spacingMax">Spacing Max</span> <input type="range" id="dbg-Dmax" min="100" max="420" step="1"></label>
        <label><span data-i18n="debug.spacingJitterMin">Spacing Jitter Min</span> <input type="range" id="dbg-SJmin" min="70" max="110" step="1"></label>
        <label><span data-i18n="debug.spacingJitterMax">Spacing Jitter Max</span> <input type="range" id="dbg-SJmax" min="90" max="140" step="1"></label>
        <label><span data-i18n="debug.shortProb">Short Rope Prob</span> <input type="range" id="dbg-shortProb" min="0" max="100" step="1"></label>
        <label><span data-i18n="debug.shortFactor">Short Rope Factor</span> <input type="range" id="dbg-shortFactor" min="50" max="95" step="1"></label>
        <label><span data-i18n="debug.longProb">Long Rope Prob</span> <input type="range" id="dbg-longProb" min="0" max="100" step="1"></label>
        <label><span data-i18n="debug.longFactor">Long Rope Factor</span> <input type="range" id="dbg-longFactor" min="105" max="170" step="1"></label>
        <label><span data-i18n="debug.breakProb">Break Prob</span> <input type="range" id="dbg-breakProb" min="0" max="100" step="1"></label>
        <label><span data-i18n="debug.itemProb">Item Spawn Prob</span> <input type="range" id="dbg-itemProb" min="0" max="100" step="1"></label>
        <label><span data-i18n="debug.shortDistanceMin">Short Distance Min</span> <input type="range" id="dbg-DshortMin" min="60" max="240" step="1"></label>
        <label><span data-i18n="debug.shortDistanceProb">Short Distance Prob</span> <input type="range" id="dbg-DshortProb" min="0" max="100" step="1"></label>
      </div>
    </div>
    <ins id="kakao-ad-slot" class="kakao_ad_area" style="display:none;"
      data-ad-unit="DAN-hlU9IMzS3yFXaqY5"
      data-ad-width="320"
      data-ad-height="100"></ins>
    <script>
      (function(){
        var Cap = (typeof window !== 'undefined' && window.Capacitor) ? window.Capacitor : {};
        var platform = typeof Cap.getPlatform === 'function' ? Cap.getPlatform() : Cap.platform;
        var isNativeApp = platform && platform !== 'web';
        if (isNativeApp) {
          var slot = document.getElementById('kakao-ad-slot');
          if (slot && slot.parentNode) {
            slot.parentNode.removeChild(slot);
          }
          return;
        }
        var script = document.createElement('script');
        script.src = '//t1.daumcdn.net/kas/static/ba.min.js';
        script.async = true;
        document.head.appendChild(script);
      })();
    </script>
    <canvas id="game" aria-label="Boing! Boing! Canvas" role="img"></canvas>
    <script src="./save/safeStorage.nomodule.js"></script>
    <script src="./save/storageBridge.nomodule.js"></script>
    <script>
      (function(){
        window.setupStorageBridge("webswing")
          .catch(e => console.error("Storage bridge init failed", e))
          .finally(function(){
            function loadScript(path) {
              return new Promise(function(resolve, reject){
                var s=document.createElement("script");
                s.src=path;
                s.onload=resolve;
                s.onerror=reject;
                document.body.appendChild(s);
              });
            }
            loadScript("./src/i18n/i18n.js")
              .then(function(){ return loadScript("./src/i18n/i18n.lang.js"); })
              .then(function(){ return loadScript("./src/data/items.js"); })
              .then(function(){ return loadScript("./src/data/chars.js"); })
              .then(function(){ return loadScript("./src/core/setup/config.js"); })
              .then(function(){ return loadScript("./src/core/setup/init.js"); })
              .then(function(){ return loadScript("./src/core/shared/utils.js"); })
              .then(function(){ return loadScript("./src/core/entities/classes.js"); })
              .then(function(){ return loadScript("./src/core/runtime/game.logic.js"); })
              .then(function(){ return loadScript("./src/core/runtime/game.input.js"); })
              .then(function(){ return loadScript("./src/core/runtime/game.render.js"); })
              .then(function(){ return loadScript("./src/core/runtime/game.shop.js"); })
              .then(function(){ return loadScript("./src/core/runtime/main.js"); })
              .catch(function(err){ console.error('Script load failed', err); });
          });
      })();
    </script>

  </body>
  </html>
