<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>WebSwing Pixi (Codex)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0f1020; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
    #game-root { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; image-rendering: pixelated; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
</head>
<body>
  <link rel="stylesheet" href="../fonts.css" />
  <div id="loading">Loading...</div>
  <div id="game-root"></div>

  <!-- Pixi.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>

  <!-- Storage bridge (re-use existing save folder) -->
  <script src="../save/safeStorage.nomodule.js"></script>
  <script src="../save/storageBridge.nomodule.js"></script>

  <!-- Game scripts (no bundler) -->
  <script src="src/config.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/particles.js"></script>
  <script src="src/items.js"></script>
  <script src="src/debug.js"></script>
  <script src="src/rope.js"></script>
  <script src="src/player.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/shop.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
