<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <main class="portal-container">
        <div class="portal-card" data-src="http://hanza8.qwpo.cc">
            <h2>Hanja Level 8 Practice</h2>
            <p>Learn Hanja level 8 in a fun way.</p>
        </div>
        <div class="portal-card" data-src="http://jumpbird.qwpo.cc">
            <h2>Jump Bird</h2>
            <p>A simple and addictive jumping game.</p>
        </div>
    </main>

    <div id="iframe-container" class="hidden">
        <nav id="iframe-nav">
            <button class="nav-button" data-src="http://hanza8.qwpo.cc">Hanja Practice</button>
            <button class="nav-button" data-src="http://jumpbird.qwpo.cc">Jump Bird</button>
            <button id="back-button">Back to Menu</button>
        </nav>
        <iframe id="content-frame" src="about:blank"></iframe>
    </div>

    <script src="script.js"></script>
</body>
</html>
